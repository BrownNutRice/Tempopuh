name: Stable release (manual, main only)

# Validation and publication run only after an explicit manual dispatch.
on:
  workflow_dispatch:
    inputs:
      publish_stable:
        description: Publish the validated APK as Tempo 4.9.0
        required: true
        type: boolean
        default: false

concurrency:
  group: stable-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Unit tests, lint, APK and extension checks
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
      TEMPO_DEBUG_STORE_PASSWORD: ${{ secrets.TEMPO_DEBUG_STORE_PASSWORD }}
      TEMPO_DEBUG_KEY_ALIAS: ${{ secrets.TEMPO_DEBUG_KEY_ALIAS }}
      TEMPO_DEBUG_KEY_PASSWORD: ${{ secrets.TEMPO_DEBUG_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Prepare established signing key
        env:
          TEMPO_DEBUG_KEYSTORE_BASE64: ${{ secrets.TEMPO_DEBUG_KEYSTORE_BASE64 }}
          TEMPO_BETA_SIGNER_SHA256: fa14beee34664d2c41bc5db00f630b564992da649fa66cb4e62c523915c95407
          PUBLISH_BETA: ${{ inputs.publish_stable }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$PUBLISH_BETA" == true ]]; then
            bash .github/scripts/beta-signing.sh check-config
          fi
          umask 077
          if [[ -n "$TEMPO_DEBUG_KEYSTORE_BASE64" ]]; then
            printf '%s' "$TEMPO_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/tempo-debug.jks"
            test -s "$RUNNER_TEMP/tempo-debug.jks"
            echo "TEMPO_DEBUG_KEYSTORE_PATH=$RUNNER_TEMP/tempo-debug.jks" >> "$GITHUB_ENV"
          else
            echo "Validation-only build with the runner debug signer."
          fi
      - run: chmod +x gradlew
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace
      - name: Android lint
        run: |
          ./gradlew :app:lintDebug --stacktrace || { cat app/build/reports/lint-results-debug.txt; exit 1; }
      - name: Retain lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-reports
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: warn
      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace
      - name: Verify APK and expected version
        env:
          TEMPO_BETA_SIGNER_SHA256: fa14beee34664d2c41bc5db00f630b564992da649fa66cb4e62c523915c95407
          PUBLISH_BETA: ${{ inputs.publish_stable }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(app/build/outputs/apk/debug/*.apk)
          test "${#apks[@]}" -eq 1
          apk="${apks[0]}"
          signer="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n1)/apksigner"
          if [[ "$PUBLISH_BETA" == true ]]; then
            bash .github/scripts/beta-signing.sh verify "$signer" "$apk"
          else
            "$signer" verify "$apk"
          fi
          grep -F 'val appVersionCode = 4819' app/build.gradle.kts
          grep -F 'val appVersionName = "4.9.0"' app/build.gradle.kts
      - uses: actions/upload-artifact@v4
        with:
          name: tempo-4.9.0-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: browser-extension/package-lock.json
      - name: Install extension dependencies
        working-directory: browser-extension
        run: npm ci
      - name: Extension typecheck
        working-directory: browser-extension
        run: npm run typecheck
      - name: Build browser packages
        working-directory: browser-extension
        run: npm run build:all
      - name: Extension smoke checks
        working-directory: browser-extension
        run: npm run smoke

  platform:
    name: Android emulator tests
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: chmod +x gradlew
      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest --stacktrace

  publish:
    name: Publish immutable GitHub release
    needs: [validate, platform]
    if: ${{ github.ref == 'refs/heads/main' && inputs.publish_stable }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v4.9.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: tempo-4.9.0-apk
          path: dist/download
      - name: Verify and stage the downloaded APK
        env:
          TEMPO_BETA_SIGNER_SHA256: fa14beee34664d2c41bc5db00f630b564992da649fa66cb4e62c523915c95407
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(dist/download/*.apk)
          test "${#apks[@]}" -eq 1
          cp "${apks[0]}" dist/Tempo-4.9.0.apk
          signer="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n1)/apksigner"
          bash .github/scripts/beta-signing.sh verify "$signer" dist/Tempo-4.9.0.apk
          (cd dist && sha256sum Tempo-4.9.0.apk > SHA256SUMS.txt)
      - name: Publish release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists; refusing to replace a published release."
            exit 1
          fi
          gh release create "$TAG" dist/Tempo-4.9.0.apk dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "Tempo 4.9.0" \
            --notes-file docs/releases/v4.9.0.md \
            --latest
