name: Appearance beta validation / release

# One-off beta branch. No automatic builds occur on main or pull requests.
on:
  push:
    branches:
      - beta/appearance-2026-11-17

permissions:
  contents: read

concurrency:
  group: appearance-beta-2026-11-17
  cancel-in-progress: true

jobs:
  validate:
    name: Unit tests, lint, build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
      TEMPO_DEBUG_STORE_PASSWORD: ${{ secrets.TEMPO_DEBUG_STORE_PASSWORD }}
      TEMPO_DEBUG_KEY_ALIAS: ${{ secrets.TEMPO_DEBUG_KEY_ALIAS }}
      TEMPO_DEBUG_KEY_PASSWORD: ${{ secrets.TEMPO_DEBUG_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Restore optional persistent debug signing key
        env:
          TEMPO_DEBUG_KEYSTORE_BASE64: ${{ secrets.TEMPO_DEBUG_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          if [[ -n "$TEMPO_DEBUG_KEYSTORE_BASE64" ]]; then
            printf '%s' "$TEMPO_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/tempo-debug.jks"
            echo "TEMPO_DEBUG_KEYSTORE_PATH=$RUNNER_TEMP/tempo-debug.jks" >> "$GITHUB_ENV"
            echo "Persistent debug signer provided."
          else
            echo "::warning::No persistent signing key: beta APK may not update earlier installations."
          fi
      - run: chmod +x gradlew
      - name: Unit tests (retry transient toolchain registry errors)
        shell: bash
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            if ./gradlew :app:testDebugUnitTest --stacktrace 2>&1 | tee "$RUNNER_TEMP/gradle-test.log"; then
              exit 0
            fi
            # Only retry Gradle plugin registry/network failures; never hide compilation/test errors.
            if ! grep -Fq "org.gradle.toolchains.foojay-resolver-convention" "$RUNNER_TEMP/gradle-test.log"; then
              exit 1
            fi
            sleep $((15 * attempt))
          done
          exit 1
      - name: Android lint
        run: ./gradlew :app:lintDebug --stacktrace
      - name: Assemble APK
        run: ./gradlew :app:assembleDebug --stacktrace
      - name: Verify APK exists and print signer
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' | head -n1)"
          test -n "$apk"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)/apksigner" verify --print-certs "$apk"
      - uses: actions/upload-artifact@v4
        with:
          name: appearance-beta-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

  platform:
    name: Android emulator tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: chmod +x gradlew
      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest --stacktrace

  publish:
    name: Publish beta prerelease
    needs: [validate, platform]
    if: contains(github.event.head_commit.message, '[publish-beta]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v4.8.16-fork.2-beta.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: appearance-beta-debug-apk
          path: dist
      - name: Stage APK and checksums
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find dist -type f -name '*.apk' | head -n1)"
          test -n "$apk"
          cp "$apk" "dist/Tempo-4.8.16-fork.2-beta.1.apk"
          rm "$apk"
          (cd dist && sha256sum Tempo-4.8.16-fork.2-beta.1.apk > SHA256SUMS.txt)
      - name: Publish verified prerelease
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists; refusing to replace published assets."
            exit 1
          fi
          gh release create "$TAG" dist/Tempo-4.8.16-fork.2-beta.1.apk dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "Tempo 4.8.16-fork.2 Beta 1 — Appearance Studio" \
            --notes-file docs/releases/v4.8.16-fork.2-beta.1.md \
            --prerelease
