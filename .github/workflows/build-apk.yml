name: Build debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

# Cancel obsolete builds when multiple commits are pushed to the same branch.
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    # Optional OAuth Web client ID for sign-in. No client secret is needed in the APK.
    env:
      GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
      TEMPO_DEBUG_STORE_PASSWORD: ${{ secrets.TEMPO_DEBUG_STORE_PASSWORD }}
      TEMPO_DEBUG_KEY_ALIAS: ${{ secrets.TEMPO_DEBUG_KEY_ALIAS }}
      TEMPO_DEBUG_KEY_PASSWORD: ${{ secrets.TEMPO_DEBUG_KEY_PASSWORD }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle
      # OAuth credentials must match the installed APK signer. Supply a stable
      # keystore in repository Secrets if using a Google Android OAuth client.
      - name: Restore optional debug signing keystore
        env:
          TEMPO_DEBUG_KEYSTORE_BASE64: ${{ secrets.TEMPO_DEBUG_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          if [ -n "$TEMPO_DEBUG_KEYSTORE_BASE64" ]; then
            printf '%s' "$TEMPO_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/tempo-debug.jks"
            echo "TEMPO_DEBUG_KEYSTORE_PATH=$RUNNER_TEMP/tempo-debug.jks" >> "$GITHUB_ENV"
          fi
      - name: Make Gradle executable
        run: chmod +x gradlew
      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace
      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tempo-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  # An explicit release marker in a main-branch commit publishes the exact APK
  # produced by the successful test+build job above. No asset is published
  # when compilation or unit tests fail. Release notes are reviewed in Git.
  publish-first-fork-preview:
    name: Publish first fork preview
    needs: apk
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[publish 4.8.16-fork.1]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release notes
        uses: actions/checkout@v4

      - name: Download APK from the verified build
        uses: actions/download-artifact@v4
        with:
          name: tempo-debug-apk
          path: release-assets

      - name: Verify and name the preview APK
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'val appVersionName = "4.8.16-fork.1"' app/build.gradle.kts
          grep -F 'val appVersionCode = 4816' app/build.gradle.kts
          shopt -s nullglob
          apks=(release-assets/*.apk)
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one built APK; found ${#apks[@]}"
            exit 1
          fi
          unzip -t "${apks[0]}" >/dev/null
          mv "${apks[0]}" release-assets/Tempo-4.8.16-fork.1-preview.apk
          sha256sum release-assets/Tempo-4.8.16-fork.1-preview.apk | tee release-assets/SHA256SUMS.txt
          echo "APK_PACKAGE_VERSION=4.8.16-fork.1" >> "$GITHUB_ENV"

      - name: Publish preview release and APK
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v4.8.16-fork.1"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release tag $TAG already exists. Refusing to rewrite a published release."
            exit 1
          fi
          gh release create "$TAG" \
            release-assets/Tempo-4.8.16-fork.1-preview.apk \
            release-assets/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "Tempo 4.8.16-fork.1 — First Fork Preview" \
            --notes-file docs/releases/v4.8.16-fork.1.md \
            --target "$GITHUB_SHA" \
            --prerelease
