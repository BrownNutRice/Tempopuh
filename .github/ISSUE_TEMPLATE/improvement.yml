name: Improvement proposal
description: Propose a focused usability or engineering improvement.
title: "[Improvement] "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and affected workflow
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain the benefit and how completion can be verified.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Related issues and constraints
